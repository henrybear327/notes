[files]
extend-exclude = [
  ".claude/",
  "assets/",
  "public/",
  "resources/",
  "themes/",
  "*.svg",
]

[default]
extend-ignore-re = [
  # objdump instruction words, such as d2800ba8
  "\\b[0-9a-f]{8}\\b",
]

[default.extend-identifiers]
# readelf program header columns
FileSiz = "FileSiz"
MemSiz = "MemSiz"
