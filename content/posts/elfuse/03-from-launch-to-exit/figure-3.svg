<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
  <style>svg{color:#1d1e20}.bg{fill:#fff}@media (prefers-color-scheme:dark){svg{color:#dadadb}.bg{fill:#1d1e20}}</style>
  <rect class="bg" width="720" height="330" stroke="none"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="30" y="40" width="160" height="70"/>
    <rect x="30" y="200" width="160" height="70"/>
    <rect x="290" y="120" width="160" height="70"/>
    <rect x="530" y="40" width="160" height="70"/>
    <rect x="530" y="200" width="160" height="70"/>
    <line x1="110" y1="110" x2="110" y2="200" marker-end="url(#a)"/>
    <line x1="190" y1="235" x2="290" y2="175" marker-end="url(#a)"/>
    <line x1="450" y1="135" x2="530" y2="85" marker-end="url(#a)"/>
    <line x1="610" y1="110" x2="610" y2="200" marker-end="url(#a)"/>
    <line x1="530" y1="235" x2="450" y2="175" marker-end="url(#a)"/>
    <rect x="270" y="20" width="440" height="280" stroke-dasharray="6 4"/>
    <rect x="15" y="20" width="190" height="280" stroke-dasharray="6 4"/>
  </g>
  <g stroke="none" text-anchor="middle">
    <text x="110" y="316" font-size="12">once per program</text>
    <text x="490" y="316" font-size="12">once per syscall that reaches elfuse</text>
    <text x="110" y="72">1. load</text>
    <text x="110" y="92" font-size="12">src/core/elf.c</text>
    <text x="110" y="232">2. boot</text>
    <text x="110" y="252" font-size="12">src/core/bootstrap.c</text>
    <text x="370" y="152">3. run</text>
    <text x="370" y="172" font-size="12">src/syscall/proc.c</text>
    <text x="610" y="72">4. translate</text>
    <text x="610" y="92" font-size="12">src/syscall/syscall.c</text>
    <text x="610" y="232">5. return</text>
    <text x="610" y="252" font-size="12">src/core/shim.S</text>
  </g>
</svg>
