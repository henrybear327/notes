  <g stroke="none">
    <text x="75" y="83" text-anchor="middle">TTBR0_EL1</text>
    <text x="225" y="64" text-anchor="middle">L0</text>
    <text x="225" y="102" text-anchor="middle">[0] table</text>
    <text x="365" y="64" text-anchor="middle">L1</text>
    <text x="365" y="102" text-anchor="middle">[0] table</text>
