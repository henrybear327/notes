<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 385" width="720" height="385" font-family="sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
  <style>svg{color:#1d1e20}.bg{fill:#fff}@media (prefers-color-scheme:dark){svg{color:#dadadb}.bg{fill:#1d1e20}}</style>
