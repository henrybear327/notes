      <path d="M0,0 L10,5 L0,10 z" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="20" y="60" width="110" height="36"/>
    <rect x="170" y="40" width="110" height="76"/>
