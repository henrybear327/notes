<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 435" width="720" height="435" font-family="sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
  <style>svg{color:#1d1e20}.bg{fill:#fff}@media (prefers-color-scheme:dark){svg{color:#dadadb}.bg{fill:#1d1e20}}</style>
  <rect class="bg" width="720" height="435" stroke="none"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="30" y="60" width="290" height="330"/>
    <line x1="30" y1="140" x2="320" y2="140"/>
    <line x1="30" y1="310" x2="320" y2="310"/>
    <rect x="400" y="60" width="290" height="70"/>
    <line x1="400" y1="60" x2="690" y2="130" stroke-dasharray="5 4"/>
    <line x1="400" y1="130" x2="690" y2="60" stroke-dasharray="5 4"/>
    <rect x="400" y="167" width="290" height="36"/>
    <rect x="400" y="222" width="290" height="36"/>
    <rect x="400" y="277" width="290" height="36"/>
    <rect x="400" y="332" width="290" height="36"/>
    <rect x="400" y="387" width="290" height="36"/>
    <line x1="545" y1="203" x2="545" y2="222" marker-end="url(#a)"/>
    <line x1="545" y1="258" x2="545" y2="277" marker-end="url(#a)"/>
    <line x1="545" y1="313" x2="545" y2="332" marker-end="url(#a)"/>
    <line x1="545" y1="368" x2="545" y2="387" marker-end="url(#a)"/>
    <line x1="400" y1="185" x2="322" y2="215" marker-end="url(#a)"/>
    <line x1="322" y1="245" x2="400" y2="350" marker-end="url(#a)"/>
  </g>
  <g stroke="none">
    <text x="175" y="40" text-anchor="middle">EL0 stack (the program)</text>
    <text x="545" y="40" text-anchor="middle">EL1 stack (the shim)</text>
    <text x="175" y="98" text-anchor="middle">main's frame</text>
    <text x="175" y="118" text-anchor="middle" font-size="12">kept = 12345, near 0x7ffc1e0</text>
    <text x="175" y="200" text-anchor="middle">signal frame</text>
    <text x="175" y="222" text-anchor="middle" font-size="12">siginfo: signal 10, sender pid 1</text>
    <text x="175" y="240" text-anchor="middle" font-size="12">ucontext: saved x0 to x30, sp, pc,</text>
    <text x="175" y="258" text-anchor="middle" font-size="12">processor state, blocked signals,</text>
    <text x="175" y="276" text-anchor="middle" font-size="12">floating-point registers</text>
    <text x="175" y="345" text-anchor="middle">handler's frame</text>
    <text x="175" y="365" text-anchor="middle" font-size="12">near 0x7ffaf7c</text>
    <text x="175" y="412" text-anchor="middle" font-size="12">lower addresses</text>
    <rect class="bg" x="440" y="82" width="210" height="26"/>
    <text x="545" y="100" text-anchor="middle" font-size="13">saved frame of the kill call</text>
    <text x="545" y="150" text-anchor="middle" font-size="12">x8 = 2: the shim discards it</text>
    <text x="410" y="190" font-size="13">1. elfuse writes the signal frame</text>
    <text x="410" y="245" font-size="13">2. eret into the handler</text>
    <text x="410" y="300" font-size="13">3. handler returns into the vDSO</text>
    <text x="410" y="355" font-size="13">4. rt_sigreturn reads the frame</text>
    <text x="410" y="410" font-size="13">5. eret: main continues after kill</text>
  </g>
</svg>
