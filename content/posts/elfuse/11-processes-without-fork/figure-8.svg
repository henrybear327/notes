<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
  <style>svg{color:#1d1e20}.bg{fill:#fff}@media (prefers-color-scheme:dark){svg{color:#dadadb}.bg{fill:#1d1e20}}</style>
  <rect class="bg" width="720" height="470" stroke="none"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" stroke="none"/>
    </marker>
  </defs>
  <g stroke-width="1.5" fill="none">
    <rect x="20" y="60" width="300" height="290"/>
    <rect x="35" y="95" width="270" height="150" stroke-dasharray="6 4"/>
    <rect x="35" y="270" width="270" height="60"/>
    <rect x="400" y="60" width="300" height="290"/>
    <rect x="415" y="95" width="270" height="150" stroke-dasharray="6 4"/>
    <rect x="415" y="270" width="270" height="60"/>
    <rect x="50" y="110" width="240" height="30"/>
    <rect x="50" y="150" width="240" height="30"/>
    <rect x="50" y="190" width="240" height="30"/>
    <rect x="430" y="110" width="240" height="30"/>
    <path d="M170,60 V30 H550 V58" marker-end="url(#a)"/>
    <line x1="320" y1="140" x2="398" y2="140" marker-end="url(#a)"/>
    <rect x="230" y="385" width="260" height="50"/>
    <path d="M170,330 V410 H228" marker-end="url(#a)"/>
    <path d="M492,410 H550 V332" marker-end="url(#a)"/>
  </g>
  <g stroke="none" text-anchor="middle">
    <rect class="bg" x="260" y="20" width="200" height="20"/>
    <text x="360" y="35" font-size="13">posix_spawn</text>
    <text x="170" y="82">elfuse: guest pid 1</text>
    <text x="550" y="82">elfuse --fork-child: pid 2</text>
    <text x="170" y="240" font-size="12">one VM</text>
    <text x="550" y="240" font-size="12">a VM of its own</text>
    <text x="170" y="130">vCPU: main thread</text>
    <text x="170" y="170">vCPU: thread 2</text>
    <text x="170" y="210">vCPU: thread 3</text>
    <text x="550" y="130">vCPU: x0 = 0</text>
    <text x="550" y="165" font-size="12">the thread that called fork,</text>
    <text x="550" y="181" font-size="12">with its registers copied</text>
    <text x="170" y="296">slab</text>
    <text x="170" y="314" font-size="12">MAP_SHARED on an unlinked file</text>
    <text x="550" y="296">slab</text>
    <text x="550" y="314" font-size="12">MAP_SHARED on the clone</text>
    <text x="359" y="128" font-size="12">socketpair</text>
    <text x="359" y="160" font-size="12">registers,</text>
    <text x="359" y="176" font-size="12">fd table,</text>
    <text x="359" y="192" font-size="12">clone fd</text>
    <text x="360" y="406">APFS clone of the file</text>
    <text x="360" y="424" font-size="12">fclonefileat: shares blocks until written</text>
  </g>
</svg>
